<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Island Survival – Casual Survival Adventure Game</title>

<meta name="description" content="Island Survival is a casual survival game where you explore islands, craft items, fight enemies and survive with day-night cycles, weather, missions and bosses.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- SEO -->
<link rel="canonical" href="https://yourname.github.io/">
<meta name="theme-color" content="#0b1220">

<!-- PWA -->
<link rel="manifest" href="manifest.json">

<style>
:root{
--bg:#0b1220;
--text:#e5e7eb;
--accent:#2ecc71;
--card:#111827;
}

*{box-sizing:border-box}
body{
margin:0;
font-family:system-ui,Arial;
background:var(--bg);
color:var(--text);
overflow-x:hidden;
}

/* HERO */
.hero{
height:100vh;
background:
linear-gradient(to top,rgba(0,0,0,.7),rgba(0,0,0,.3)),
url("images/island-bg.jpg") center/cover fixed;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
position:relative;
}
.hero h1{font-size:4rem}
.hero p{max-width:700px;margin:20px auto}
.hero a img{height:80px;margin-top:20px}

/* CLOUDS */
.clouds{
position:absolute;
top:0;left:0;
width:200%;
height:100%;
background:url("images/image1.png") repeat-x;
animation:cloudMove 120s linear infinite;
opacity:.35;
pointer-events:none;
}
@keyframes cloudMove{
from{transform:translateX(0)}
to{transform:translateX(-50%)}
}

/* RAIN */
.rain{
position:absolute;
inset:0;
background:url("images/image1.png");
animation:rain 0.4s linear infinite;
opacity:.2;
pointer-events:none;
}
@keyframes rain{
from{background-position:0 0}
to{background-position:0 100%}
}

/* SECTION */
section{
padding:120px 20px;
max-width:1400px;
margin:auto;
}
h2{text-align:center;font-size:2.8rem;margin-bottom:40px}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:40px;
}
.card{
background:var(--card);
padding:30px;
border-radius:24px;
}

/* AI */
.ai{
display:flex;
justify-content:space-between;
gap:20px;
}
.state{
flex:1;
padding:30px;
border-radius:20px;
background:#020617;
text-align:center;
opacity:.3;
transition:.4s;
}
.state.active{
opacity:1;
outline:3px solid var(--accent);
}

/* SVG CRAFT */
svg{
width:100%;
max-width:800px;
display:block;
margin:auto;
}
.node{
fill:#1f2937;
stroke:#2ecc71;
stroke-width:3;
cursor:pointer;
}
.link{
stroke:#2ecc71;
stroke-width:4;
stroke-dasharray:10;
animation:dash 2s linear infinite;
}
@keyframes dash{
to{stroke-dashoffset:-20}
}

/* SOUND */
.sound{
position:fixed;
top:20px;
right:20px;
background:var(--accent);
color:#000;
padding:12px 16px;
border-radius:14px;
font-weight:800;
cursor:pointer;
z-index:999;
}

/* FOOTER */
footer{
padding:60px;
text-align:center;
background:#020617;
}

/* MOBILE */
@media(max-width:900px){
.hero h1{font-size:2.6rem}
.ai{flex-direction:column}
}
</style>
</head>

<body>

<!-- SOUND -->
<div class="sound" id="soundBtn">🔊 Sound OFF</div>
<audio id="ambience" loop>
<source src="audio/ambience.mp3" type="audio/mpeg">
</audio>

<!-- HERO -->
<div class="hero">
<div class="clouds"></div>
<div class="rain"></div>
<div>
<h1>ISLAND SURVIVAL</h1>
<p>Stranded. Alone. Survive the island.</p>

<!-- PLAY STORE BADGE -->
<a href="https://play.google.com/store/apps/details?id=YOUR_PACKAGE"
aria-label="Download Island Survival on Google Play">
<img src="https://play.google.com/intl/en_us/badges/images/generic/en_badge_web_generic.png"
alt="Get it on Google Play">
</a>
</div>
</div>

<!-- ENEMY AI -->
<section>
<h2>Enemy AI Behavior</h2>
<div class="ai" id="ai">
<div class="state">Patrol</div>
<div class="state">Detect</div>
<div class="state">Chase</div>
<div class="state">Attack</div>
<div class="state">Retreat</div>
</div>
</section>

<!-- CRAFTING GRAPH -->
<section>
<h2>Crafting System</h2>

<svg viewBox="0 0 800 300">
<line class="link" x1="150" y1="150" x2="350" y2="150"/>
<line class="link" x1="350" y1="150" x2="550" y2="150"/>

<circle class="node" cx="150" cy="150" r="40" onclick="craft('Wood → Harvested from trees')"/>
<circle class="node" cx="350" cy="150" r="40" onclick="craft('Planks → Crafted from wood')"/>
<circle class="node" cx="550" cy="150" r="40" onclick="craft('Building → Use planks to build shelter')"/>
</svg>

<p id="craftText" style="text-align:center;margin-top:20px"></p>
</section>

<footer>
© 2025 Aarohi Studio  
<br>Casual survival adventure built with passion
</footer>

<script>
// SOUND
const audio=document.getElementById("ambience");
const btn=document.getElementById("soundBtn");
let playing=false;

btn.onclick=()=>{
playing=!playing;
if(playing){
audio.play();
btn.textContent="🔊 Sound ON";
}else{
audio.pause();
btn.textContent="🔇 Sound OFF";
}
};
document.addEventListener("visibilitychange",()=>{
if(document.hidden) audio.pause();
});

// AI ANIMATION
let i=0;
setInterval(()=>{
document.querySelectorAll(".state").forEach(s=>s.classList.remove("active"));
document.querySelectorAll(".state")[i].classList.add("active");
i=(i+1)%5;
},1500);

// CRAFT TEXT
function craft(text){
document.getElementById("craftText").textContent=text;
}

// SERVICE WORKER
if("serviceWorker" in navigator){
navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
